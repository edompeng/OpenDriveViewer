name: Cross-Platform Build & Release Pipeline

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  actions: write
  id-token: write
  attestations: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            job_name: linux
            artifact_name: 'app-linux.tar.gz'
            
          - os: macos-14
            job_name: macos
            qt_host: 'mac'
            qt_arch: 'clang_64'
            vcpkg_triplet: 'arm64-osx'
            qt_version: '6.9.1'
            artifact_name: 'app-macos.dmg'
            
          - os: windows-2022
            job_name: windows
            qt_host: 'windows'
            qt_arch: 'win64_msvc2022_64'
            vcpkg_triplet: 'x64-windows'
            qt_version: '6.9.1'
            artifact_name: 'app-windows.zip'

    env:
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg_cache,readwrite'
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DOWNLOADS: ${{ github.workspace }}/vcpkg_downloads

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Resolve application version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev+${GITHUB_SHA:0:7}"
          fi
          echo "GEOVIEWER_VERSION=${version}" >> "$GITHUB_ENV"

      - name: Install System Dependencies (macOS)
        if: matrix.os == 'macos-14'
        run: |
          brew install proj

      - name: Install Qt
        if: matrix.os != 'ubuntu-22.04'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          host: ${{ matrix.qt_host }}
          target: 'desktop'
          arch: ${{ matrix.qt_arch }}
          cache: true
          # More specific cache key to avoid architecture/version mismatches
          cache-key-prefix: qt-${{ matrix.os }}-${{ matrix.qt_version }}-${{ matrix.qt_arch }}

      # Cache built library packages (vcpkg ports) for maximum compilation speedup.
      # We do not manually cache the vcpkg tool/repository itself since bootstrapping the exe is extremely fast (< 1s),
      # and this avoids hitting GitHub's 10GB cache limit or caching corrupt/outdated repositories.

      - name: Cache vcpkg binary packages
        if: matrix.os == 'windows-2022'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-binaries-${{ matrix.os }}-c3867e71-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-binaries-${{ matrix.os }}-c3867e71-
            vcpkg-binaries-${{ matrix.os }}-
      - name: Export GitHub Actions Cache Environment Variables
        if: matrix.os == 'windows-2022'
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Debug vcpkg caching env
        if: matrix.os == 'windows-2022'
        run: |
          echo "VCPKG_BINARY_SOURCES: $env:VCPKG_BINARY_SOURCES"
          # Ensure cache directory exists and fix path separators for vcpkg
          New-Item -ItemType Directory -Force -Path ${{ github.workspace }}/vcpkg_cache
          $VCPKG_CACHE_PATH = "${{ github.workspace }}/vcpkg_cache".Replace('\', '/')
          echo "VCPKG_BINARY_SOURCES=clear;files,$VCPKG_CACHE_PATH,readwrite" >> $env:GITHUB_ENV
          echo "ACTIONS_CACHE_URL: $env:ACTIONS_CACHE_URL"
          echo "ACTIONS_RUNTIME_TOKEN: $env:ACTIONS_RUNTIME_TOKEN"
      - name: Setup vcpkg (Windows only for PROJ)
        if: matrix.os == 'windows-2022'
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ env.VCPKG_ROOT }}
          vcpkgGitCommitId: 'c3867e714dd3a51c272826eea77267876517ed99'
          vcpkgJsonGlob: 'vcpkg.json'
          runVcpkgInstall: true
        env:
          VCPKG_DEFAULT_TRIPLET: ${{ matrix.vcpkg_triplet }}
          VCPKG_INSTALLED_DIR: '${{ github.workspace }}/vcpkg_installed'
          VCPKG_DOWNLOADS: ${{ env.VCPKG_DOWNLOADS }}

      - name: Set Environment Variables
        if: matrix.os != 'ubuntu-22.04'
        shell: bash
        run: |
          echo "QT6_ROOT=$QT_ROOT_DIR" >> $GITHUB_ENV
          if [ "${{ matrix.os }}" = "macos-14" ]; then
            echo "PROJ_ROOT=$(brew --prefix proj)" >> $GITHUB_ENV
          elif [ "${{ matrix.os }}" = "windows-2022" ]; then
            echo "PROJ_ROOT=${{ github.workspace }}/vcpkg_installed/${{ matrix.vcpkg_triplet }}" >> $GITHUB_ENV
            QT_BIN=$(echo "$QT_ROOT_DIR/bin" | tr '/' '\\')
            PROJ_BIN=$(echo "${{ github.workspace }}/vcpkg_installed/${{ matrix.vcpkg_triplet }}/bin" | tr '/' '\\')
            echo "$QT_BIN" >> $GITHUB_PATH
            echo "$PROJ_BIN" >> $GITHUB_PATH
          fi

      - name: Cache Bazel
        if: matrix.os != 'ubuntu-22.04'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/bazel-repo
            ~/.cache/bazel-disk
          # Key includes all files that can trigger a full dependency re-fetch
          key: bazel-${{ matrix.os }}-${{ hashFiles('**/BUILD*', '**/WORKSPACE*', 'MODULE.bazel', '*.bzl') }}
          restore-keys: |
            bazel-${{ matrix.os }}-

      - name: Cache CMake FetchContent (Linux Musl)
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/cmake_deps
          key: cmake-deps-alpine-${{ hashFiles('CMakeLists.txt', 'src/CMakeLists.txt') }}
          restore-keys: |
            cmake-deps-alpine-

      - name: Cache Ccache (Linux Musl)
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-alpine-${{ github.sha }}
          restore-keys: |
            ccache-alpine-

      - name: Build, Test & Package (Linux Musl)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          mkdir -p ${{ github.workspace }}/cmake_deps
          mkdir -p ${{ github.workspace }}/.ccache
          docker run -i --rm \
            -e GEOVIEWER_VERSION="${GEOVIEWER_VERSION}" \
            -v ${{ github.workspace }}:/workspace \
            -v ${{ github.workspace }}/.ccache:/root/.ccache \
            -w /workspace alpine:3.20 sh << 'EOF'
          set -e
          apk update
          apk add --no-cache alpine-sdk build-base cmake ninja ccache qt6-qtbase-dev qt6-qtbase-x11 mesa-dev qt6-qttools-dev proj-dev patchelf libunwind-dev bash xvfb xvfb-run mesa-dri-gallium mesa-gl mesa-egl
          apk add --no-cache --repository=http://dl-cdn.alpinelinux.org/alpine/edge/testing gperftools-dev || true
          
          # Configure ccache
          export CCACHE_DIR=/root/.ccache
          export CCACHE_MAXSIZE=500M
          ccache --zero-stats
          
          # Configure and Build with ccache
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DGEOVIEWER_VERSION="${GEOVIEWER_VERSION}" \
            -DFETCHCONTENT_BASE_DIR="/workspace/cmake_deps" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --config RelWithDebInfo
          
          # Show ccache stats
          ccache --show-stats
          
          # Test
          cd build
          xvfb-run --auto-servernum ctest -C RelWithDebInfo --output-on-failure
          cd ..
          
          # Package if it's a release tag
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            export QT6_ROOT=/usr/lib/qt6
            export PROJ_ROOT=/usr
            chmod +x scripts/deploy/package_linux.sh
            ./scripts/deploy/package_linux.sh
          fi
          EOF
          
          # Create archive for release
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            tar -czvf ${{ github.workspace }}/${{ matrix.artifact_name }} -C dist/linux OpenDriveViewer_linux_x64
          fi

      - name: Build and Test with Bazel
        if: matrix.os != 'ubuntu-22.04'
        shell: bash
        run: |
          BAZEL_STARTUP_OPTS="--host_jvm_args=-Djava.net.preferIPv4Stack=true"
          BAZEL_OPTS="--repository_cache=$HOME/.cache/bazel-repo --disk_cache=$HOME/.cache/bazel-disk --keep_going --show_result=10 --registry=https://bcr.bazel.build"
          COMMON_FLAGS="-c opt"
          
          if [ "${{ matrix.os }}" = "windows-2022" ]; then
            TCMALLOC_LIB=$(find "${{ env.PROJ_ROOT }}/lib" -name "*tcmalloc*.lib" | head -n 1 | tr '/' '\\')
            export PATH="${{ env.PROJ_ROOT }}/bin:$PATH"
            VERSION_COPT="-DGEOVIEWER_VERSION=\"${GEOVIEWER_VERSION}\""
            bazel $BAZEL_STARTUP_OPTS test $COMMON_FLAGS --linkopt="${TCMALLOC_LIB}" //... --test_output=errors $BAZEL_OPTS --config=windows \
              --copt="${VERSION_COPT}" \
              --action_env=QT6_ROOT="${{ env.QT_ROOT_DIR }}" \
              --action_env=PROJ_ROOT="${{ env.PROJ_ROOT }}" \
              --action_env=GITHUB_WORKSPACE="${{ github.workspace }}" \
              --test_env=PATH \
              --test_env=GEOVIEWER_VERSION
            bazel $BAZEL_STARTUP_OPTS build $COMMON_FLAGS --linkopt="${TCMALLOC_LIB}" //src/app:OpenDriveViewer $BAZEL_OPTS --config=windows \
              --copt="${VERSION_COPT}" \
              --action_env=QT6_ROOT="${{ env.QT_ROOT_DIR }}" \
              --action_env=PROJ_ROOT="${{ env.PROJ_ROOT }}" \
              --action_env=GITHUB_WORKSPACE="${{ github.workspace }}"
          else
            bazel $BAZEL_STARTUP_OPTS test $COMMON_FLAGS //... --test_output=errors $BAZEL_OPTS --config=macos \
              --copt="-DGEOVIEWER_VERSION=\"${GEOVIEWER_VERSION}\"" \
              --action_env=QT6_ROOT="${{ env.QT_ROOT_DIR }}" \
              --action_env=PROJ_ROOT="${{ env.PROJ_ROOT }}" \
              --test_env=GEOVIEWER_VERSION
          fi
      
      - name: Package (macOS)
        if: matrix.os == 'macos-14' && startsWith(github.ref, 'refs/tags/v')
        run: |
          chmod +x scripts/deploy/package_macos.sh
          ./scripts/deploy/package_macos.sh
          # The script produces dist/mac/OpenDriveViewer.dmg, move it to root for upload
          mv dist/mac/OpenDriveViewer.dmg ${{ github.workspace }}/${{ matrix.artifact_name }}

      - name: Package (Windows)
        if: matrix.os == 'windows-2022' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          QT6_ROOT: ${{ env.QT6_ROOT }}
          PROJ_ROOT: ${{ env.PROJ_ROOT }}
        run: |
          ./scripts/deploy/package_windows.ps1
          # The script produces a folder: dist/windows/OpenDriveViewer_win_x64
          Compress-Archive -Path dist/windows/OpenDriveViewer_win_x64 -DestinationPath ${{ github.workspace }}/${{ matrix.artifact_name }}

      - name: Generate Artifact Attestation
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ github.workspace }}/${{ matrix.artifact_name }}

      - name: Upload Intermediate Artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ github.workspace }}/${{ matrix.artifact_name }}
          retention-days: 1

      - name: Upload Symbols Artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: symbols-${{ matrix.os }}
          path: |
            ${{ github.workspace }}/*symbols.zip
            ${{ github.workspace }}/*symbols.tar.gz
          if-no-files-found: ignore
          retention-days: 1

      - name: Cleanup Old Caches
        if: always()
        shell: bash
        run: |
          # Keep only the 10 most recent caches for the current branch to avoid hitting the 10GB limit
          gh cache list --ref ${{ github.ref }} --limit 100 --json id,createdAt -q 'sort_by(.createdAt) | reverse | .[10:] | .[].id' | xargs -I {} gh cache delete {} || true
        env:
          GH_TOKEN: ${{ github.token }}

  build-verify:
    name: Verify ${{ matrix.job_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            job_name: linux-bazel
            build_system: bazel
            qt_version: '6.9.*'
          - os: ubuntu-22.04
            job_name: linux-cmake
            build_system: cmake
            vcpkg_triplet: 'x64-linux'
            qt_version: '6.9.*'
          - os: macos-14
            job_name: macos-cmake
            build_system: cmake
            vcpkg_triplet: 'arm64-osx'
            qt_version: '6.9.1'
          - os: windows-2022
            job_name: windows-cmake
            build_system: cmake
            vcpkg_triplet: 'x64-windows'
            qt_version: '6.9.1'

    env:
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg_cache,readwrite'
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DOWNLOADS: ${{ github.workspace }}/vcpkg_downloads
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Resolve application version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev+${GITHUB_SHA:0:7}"
          fi
          echo "GEOVIEWER_VERSION=${version}" >> "$GITHUB_ENV"

      - name: Install System Dependencies
        if: matrix.os != 'windows-2022'
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-22.04" ]; then
            sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev xvfb libproj-dev libunwind-dev libgoogle-perftools-dev ninja-build
          else
            brew install proj ninja
          fi

      - name: Setup Ccache
        if: matrix.build_system == 'cmake'
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ matrix.job_name }}-ccache
          variant: ccache
          append-timestamp: true

      # Cache built library packages (vcpkg ports) for maximum compilation speedup.
      # We do not manually cache the vcpkg tool/repository itself since bootstrapping the exe is extremely fast (< 1s),
      # and this avoids hitting GitHub's 10GB cache limit or caching corrupt/outdated repositories.

      - name: Cache vcpkg binary packages
        if: matrix.os == 'windows-2022'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-binaries-${{ matrix.os }}-c3867e71-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-binaries-${{ matrix.os }}-c3867e71-
            vcpkg-binaries-${{ matrix.os }}-
      - name: Export GitHub Actions Cache Environment Variables
        if: matrix.os == 'windows-2022'
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Debug vcpkg caching env
        if: matrix.os == 'windows-2022'
        run: |
          echo "VCPKG_BINARY_SOURCES: $env:VCPKG_BINARY_SOURCES"
          # Ensure cache directory exists and fix path separators for vcpkg
          New-Item -ItemType Directory -Force -Path ${{ github.workspace }}/vcpkg_cache
          $VCPKG_CACHE_PATH = "${{ github.workspace }}/vcpkg_cache".Replace('\', '/')
          echo "VCPKG_BINARY_SOURCES=clear;files,$VCPKG_CACHE_PATH,readwrite" >> $env:GITHUB_ENV
          echo "ACTIONS_CACHE_URL: $env:ACTIONS_CACHE_URL"
          echo "ACTIONS_RUNTIME_TOKEN: $env:ACTIONS_RUNTIME_TOKEN"
      - name: Setup vcpkg (Windows only for PROJ)
        if: matrix.os == 'windows-2022'
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ env.VCPKG_ROOT }}
          vcpkgGitCommitId: 'c3867e714dd3a51c272826eea77267876517ed99'
          vcpkgJsonGlob: 'vcpkg.json'
          runVcpkgInstall: true
        env:
          VCPKG_DEFAULT_TRIPLET: ${{ matrix.vcpkg_triplet }}
          VCPKG_INSTALLED_DIR: '${{ github.workspace }}/vcpkg_installed'
          VCPKG_DOWNLOADS: ${{ env.VCPKG_DOWNLOADS }}

      - name: Setup MSVC
        if: matrix.os == 'windows-2022'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          cache: true

      - name: Set Environment Variables
        shell: bash
        run: |
          echo "QT6_ROOT=$QT_ROOT_DIR" >> $GITHUB_ENV
          if [ "${{ matrix.os }}" = "ubuntu-22.04" ]; then
            echo "PROJ_ROOT=/usr" >> $GITHUB_ENV
          elif [ "${{ matrix.os }}" = "macos-14" ]; then
            echo "PROJ_ROOT=$(brew --prefix proj)" >> $GITHUB_ENV
          elif [ "${{ matrix.os }}" = "windows-2022" ]; then
            echo "PROJ_ROOT=${{ github.workspace }}/vcpkg_installed/${{ matrix.vcpkg_triplet }}" >> $GITHUB_ENV
            QT_BIN=$(echo "$QT_ROOT_DIR/bin" | tr '/' '\\')
            PROJ_BIN=$(echo "${{ github.workspace }}/vcpkg_installed/${{ matrix.vcpkg_triplet }}/bin" | tr '/' '\\')
            echo "$QT_BIN" >> $GITHUB_PATH
            echo "$PROJ_BIN" >> $GITHUB_PATH
          fi

      # --- CMake-specific steps ---
      - name: Cache CMake FetchContent
        if: matrix.build_system == 'cmake'
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/cmake_deps
          key: cmake-deps-${{ matrix.os }}-${{ hashFiles('CMakeLists.txt', 'src/CMakeLists.txt') }}
          restore-keys: |
            cmake-deps-${{ matrix.os }}-

      - name: Configure and Build (CMake)
        if: matrix.build_system == 'cmake'
        shell: bash
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DGEOVIEWER_VERSION="${GEOVIEWER_VERSION}" \
            -DFETCHCONTENT_BASE_DIR="${{ github.workspace }}/cmake_deps" \
            -DQT_PATH="${{ env.QT_ROOT_DIR }}" \
            -DPROJ_ROOT="${{ env.PROJ_ROOT }}" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --config RelWithDebInfo

      - name: Test (CMake)
        if: matrix.build_system == 'cmake'
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-2022" ]; then
            QT_BIN_DIR=$(echo "$QT_ROOT_DIR/bin" | tr '\\' '/')
            VCPKG_BIN_DIR=$(echo "${{ github.workspace }}/vcpkg_installed/${{ matrix.vcpkg_triplet }}/bin" | tr '\\' '/')
            echo "Copying DLLs to build/bin..."
            cp "$QT_BIN_DIR"/*.dll build/bin/
            cp "$VCPKG_BIN_DIR"/*.dll build/bin/
          fi
          cd build
          if [ "${{ matrix.os }}" = "ubuntu-22.04" ]; then
            xvfb-run --auto-servernum ctest -C RelWithDebInfo --output-on-failure
          else
            ctest -C RelWithDebInfo --output-on-failure
          fi

      # --- Bazel-specific steps ---
      - name: Cache Bazel
        if: matrix.build_system == 'bazel'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/bazel-repo
            ~/.cache/bazel-disk
          key: bazel-${{ matrix.os }}-${{ hashFiles('**/BUILD*', '**/WORKSPACE*', 'MODULE.bazel', '*.bzl') }}
          restore-keys: |
            bazel-${{ matrix.os }}-

      - name: Build and Test (Bazel)
        if: matrix.build_system == 'bazel'
        shell: bash
        run: |
          BAZEL_STARTUP_OPTS="--host_jvm_args=-Djava.net.preferIPv4Stack=true"
          BAZEL_OPTS="--repository_cache=$HOME/.cache/bazel-repo --disk_cache=$HOME/.cache/bazel-disk --keep_going --show_result=10 --registry=https://bcr.bazel.build"
          COMMON_FLAGS="-c opt"
          
          xvfb-run --auto-servernum bazel $BAZEL_STARTUP_OPTS test $COMMON_FLAGS //... --test_output=errors $BAZEL_OPTS --config=linux \
            --copt="-DGEOVIEWER_VERSION=\"${GEOVIEWER_VERSION}\"" \
            --action_env=QT6_ROOT="${{ env.QT_ROOT_DIR }}" \
            --action_env=PROJ_ROOT="${{ env.PROJ_ROOT }}" \
            --test_env=GEOVIEWER_VERSION

      - name: Cleanup Old Caches
        if: always()
        shell: bash
        run: |
          # Keep only the 10 most recent caches for the current branch to avoid hitting the 10GB limit
          gh cache list --ref ${{ github.ref }} --limit 100 --json id,createdAt -q 'sort_by(.createdAt) | reverse | .[10:] | .[].id' | xargs -I {} gh cache delete {} || true
        env:
          GH_TOKEN: ${{ github.token }}

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v6
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
